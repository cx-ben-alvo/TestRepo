name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o server cmd/server/main.go

      - name: Run tests
        run: |
          if find . -name '*_test.go' -not -path './vendor/*' | grep -q .; then
            go test -v ./...
          else
            echo "No Go test files found; skipping tests."
          fi
